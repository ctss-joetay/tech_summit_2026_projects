<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canteen Ops Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="console">
    <header class="titlebar">
      <span class="titletext">canteen_ops@summit:~$ monitor --live</span>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="label">OCCUPANCY</span>
        <span class="value" id="stat-occupancy">0 / 0</span>
      </div>
      <div class="stat">
        <span class="label">LOAD</span>
        <span class="value" id="stat-load">0%</span>
      </div>
      <div class="stat">
        <span class="label">AVG WAIT (EAT TIME)</span>
        <span class="value" id="stat-wait">0.0s</span>
      </div>
      <div class="stat">
        <span class="label">SERVED TOTAL</span>
        <span class="value" id="stat-served">0</span>
      </div>
      <div class="stat status-stat">
        <span class="label">STATUS</span>
        <span class="value" id="stat-status">NOMINAL</span>
      </div>
    </section>

    <section class="control-row">
      <label>MAX OCCUPANCY: <span id="capacity-readout">40</span></label>
      <div class="block-bar" id="block-bar" aria-hidden="true"></div>
    </section>

    <section class="split">
      <div class="log-window" id="log-window" aria-live="polite">
        <div class="log-line boot">canteen_ops v1.0 initialized...</div>
      </div>
      <pre class="tables-panel" id="tables-panel" aria-hidden="true"></pre>
    </section>

    <div class="cli-input-row">
      <span class="cli-prefix">&gt;</span>
      <input type="text" id="cli-input" class="cli-input" placeholder="type 'help' for commands" autocomplete="off">
      <span class="blink">_</span>
    </div>
  </main>

  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
