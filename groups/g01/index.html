<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-cafe-grid.css">
</head>
<body>
  <div id="reminder-banner" class="banner">
    <span id="banner-text">No tasks yet — add one below!</span>
    <button id="banner-pause" type="button" title="Pause/resume reminder cycling">⏸</button>
  </div>
  <div id="celebration" class="celebration" hidden></div>

  <main id="main-view">
    <div class="wood-panel">
      <h1>Task Tracker</h1>

      <div id="tree-box" class="tree-box">
        <div id="tree-visual"></div>
        <span id="tree-caption">Complete tasks to grow your tree!</span>
      </div>

      <form id="task-form">
        <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
        <button id="priority-toggle" type="button" class="priority-btn priority-btn-medium" title="Click to change priority" data-priority="medium">Medium</button>
        <button type="submit">Add task</button>
      </form>

      <label class="focus-toggle">
        <input type="checkbox" id="focus-mode">
        Focus mode (show just one task at a time)
      </label>
    </div>

    <div class="paper-panel">
      <section>
        <h2>Active tasks</h2>
        <ul id="task-list"></ul>
      </section>

      <section>
        <h2>Retired (completed)</h2>
        <ul id="completed-list"></ul>
      </section>
    </div>
  </main>

  <main id="notes-view" hidden>
    <button id="notes-back" type="button">&larr; Back</button>
    <h1 id="notes-heading">Task</h1>
    <textarea id="notes-text" placeholder="Jot down notes for this task..."></textarea>
  </main>

  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
