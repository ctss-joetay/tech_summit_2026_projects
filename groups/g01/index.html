<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="reminder-banner" class="banner">No tasks yet — add one below!</div>

  <main>
    <h1>Task Tracker</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <section>
      <h2>Active tasks</h2>
      <ul id="task-list"></ul>
    </section>

    <section>
      <h2>Retired (completed)</h2>
      <ul id="completed-list"></ul>
    </section>
  </main>

  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
