<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard & Poll</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tech Summit Dashboard</h1>

    <section class="card">
      <h2>Age Leaderboard</h2>
      <form id="age-form">
        <input type="text" id="name-input" placeholder="Your name" required>
        <input type="number" id="age-input" placeholder="Your age" min="1" max="120" required>
        <button type="submit">Add</button>
      </form>
      <ol id="leaderboard-list"></ol>
    </section>

    <section class="card">
      <h2>Coffee or Tea?</h2>
      <div class="poll-buttons">
        <button id="vote-coffee">☕ Coffee</button>
        <button id="vote-tea">🍵 Tea</button>
      </div>
      <div id="poll-results" class="poll-results"></div>
    </section>
  </main>
  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
