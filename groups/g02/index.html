<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="select-screen" class="screen">
    <h1 class="title">🎤 Pitch Quest</h1>
    <p class="subtitle">Pick a level, then sing your way through it!</p>

    <div id="slider-track" class="slider-track">
      <div id="hover-left" class="hover-zone hover-left"></div>
      <div id="slider-strip" class="slider-strip">
        <!-- level cards injected by script.js -->
      </div>
      <div id="hover-right" class="hover-zone hover-right"></div>
    </div>

    <p id="select-hint" class="hint">Drag the row, or hold your mouse near an edge to scroll. Click a level to start.</p>
    <p id="select-error" class="error" role="alert"></p>
  </section>

  <section id="level-screen" class="screen hidden">
    <div id="hearts" class="hearts"></div>
    <div id="mic-status" class="mic-status">
      <span id="mic-label">🎙️</span>
      <div class="mic-meter"><div id="mic-meter-fill" class="mic-meter-fill"></div></div>
    </div>
    <div id="stage-message" class="stage-message"></div>
    <div id="staff-area" class="staff-area">
      <div id="staff-lines" class="staff-lines"></div>
      <div id="notes-layer" class="notes-layer"></div>
      <div id="confetti-layer" class="confetti-layer"></div>
      <div id="player-square" class="player-square"></div>
      <div id="result-overlay" class="result-overlay hidden">
        <div id="result-title" class="result-title"></div>
        <div class="result-buttons">
          <button id="retry-btn" class="secondary-btn">Retry</button>
          <button id="result-back-btn" class="secondary-btn">← Levels</button>
        </div>
      </div>
    </div>
    <p class="hint">Press <strong>Space</strong> or click the stage to start. Sing to move up and down!</p>
    <button id="back-btn" class="secondary-btn">← Back to levels</button>
  </section>

  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
  <script src="level.js"></script>
</body>
</html>
