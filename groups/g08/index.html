<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌙 Sleep Tracker</h1>
  </header>

  <section class="hero">
    <h2>Log your sleep, watch the pattern</h2>
    <p>Set a nightly goal and record when you go to bed and wake up.</p>
  </section>

  <main>
    <section class="goal-panel">
      <label for="goal-input">Sleep goal (hours):</label>
      <input id="goal-input" type="number" min="0" step="0.5" placeholder="e.g. 8">
      <button id="save-goal-btn">Save Goal</button>
    </section>

    <section class="summary-panel">
      <p id="last-night">Last night: —</p>
      <p id="avg-sleep">7-night average: —</p>
      <p id="goal-status"></p>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </section>

    <section class="add-sleep-panel">
      <h3>Log a night's sleep</h3>
      <form id="sleep-form">
        <label>
          Date
          <input id="sleep-date" type="date" required>
        </label>
        <label>
          Bedtime
          <input id="bed-time" type="time" required>
        </label>
        <label>
          Wake time
          <input id="wake-time" type="time" required>
        </label>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="log-panel">
      <h3>Sleep log</h3>
      <ul id="sleep-log"></ul>
      <p id="log-empty" class="hidden">No nights logged yet — add one above.</p>
      <button id="clear-log-btn">Clear All Log</button>
    </section>
  </main>

  <footer>
    <p>Sleep Tracker — built for Tech Summit 2026. Not medical advice.</p>
  </footer>

  <script src="_summit/runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
